; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev   ; plain Upload = cable only; choose env:ota for Wi-Fi

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM3
board_build.partitions = default.csv   ; two app slots (app0/app1, 1.25 MB each) - needed for OTA
lib_deps = fastled/FastLED @ ^3.6.0

; Upload over Wi-Fi. Needs the Windows env variable OTA_PASSWORD
; (same value as in src/secrets.h). The laptop must be in the same Wi-Fi as the ESP32.
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = bloombot.local
upload_flags = --auth=${sysenv.OTA_PASSWORD}
