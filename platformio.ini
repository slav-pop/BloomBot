; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev   ; plain Upload = cable only; choose env:ota for Wi-Fi

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM3
board_build.partitions = default.csv   ; two app slots (app0/app1, 1.25 MB each) - needed for OTA
lib_deps =
    fastled/FastLED @ ^3.6.0
    bblanchon/ArduinoJson @ ^7.2.1
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.0
    adafruit/Adafruit GFX Library @ ^1.11.0

; Upload over Wi-Fi. Needs the Windows env variable OTA_PASSWORD
; (same value as in src/secrets.h). The laptop must be in the same Wi-Fi as the ESP32.
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = bloombot.local
upload_flags = --auth=${sysenv.OTA_PASSWORD}
; Monitor over Wi-Fi (telnet log, see src/logger.h): the monitor button in env:ota connects here
monitor_port = socket://bloombot.local:23

; ---- Display demo (see demo/display_demo/README.md) ----
; Only the screen + Wi-Fi/OTA/telnet: no pump, no sensors, no server.
; Uses the real src/display.cpp, logger, wifi_ota and state, plus its own main.
; After trying the demo, upload env:esp32dev or env:ota again to get the real firmware back.
[env:display_demo]
extends = env:esp32dev
build_src_filter = -<*> +<display.cpp> +<logger.cpp> +<wifi_ota.cpp> +<state.cpp> +<../demo/display_demo/>
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.0
    adafruit/Adafruit GFX Library @ ^1.11.0

[env:display_demo_ota]
extends = env:display_demo
upload_protocol = espota
upload_port = bloombot.local
upload_flags = --auth=${sysenv.OTA_PASSWORD}
monitor_port = socket://bloombot.local:23

; ---- Monitor through the web bridge (BloomBot-Web/scripts/device-bridge.mjs) ----
; The ESP32 telnet accepts only ONE client. While the bridge runs (web page "Das echte
; Gerät steuern"), use THIS environment's Monitor: log + typing work, the page keeps working.
[env:monitor_bridge]
extends = env:ota
monitor_port = socket://127.0.0.1:2323
